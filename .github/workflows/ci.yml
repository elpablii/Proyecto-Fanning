# Revisión automática: en cada push o pull request a main, GitHub comprueba que
# el conteo, las fichas y la página estén bien antes de que Vercel publique.
name: Revisión

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  datos:
    name: Conteo y fichas (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Pruebas del conteo
        run: python fanning.py probar
      - name: Fichas válidas (sin errores ni PDFs faltantes)
        run: python fanning.py validar

  pagina:
    name: Página (lint, tipos y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fanning-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fanning-dashboard/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
